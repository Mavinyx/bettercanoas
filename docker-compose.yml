services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: bettercanoas_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bettercanoas_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mapeia os arquivos SQL locais para serem executados ao iniciar o banco
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - bettercanoas-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bettercanoas_api
    env_file:
      - .env
    environment:
      AI_API_KEY: ${AI_API_KEY:?Defina AI_API_KEY no arquivo .env}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-default}
      AI_MODEL: ${AI_MODEL:-${GEMINI_MODEL:-gemini-3.5-flash}}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-${GEMINI_FALLBACK_MODEL:-gemini-2.5-flash-lite}}
      API_SECURITY_TOKEN_SECRET: ${API_SECURITY_TOKEN_SECRET:-my-secret-key}
      DATABASE_URL: postgresql://postgres:5432/bettercanoas_db
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - bettercanoas-net
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: bettercanoas_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - app
    networks:
      - bettercanoas-net

volumes:
  pgdata:

networks:
  bettercanoas-net:
